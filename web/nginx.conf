# SPA static server + API reverse proxy.
#
# The frontend calls the same origin it was served from, so the browser never
# makes a cross-origin request and CORS is not involved. The API container is
# not exposed on the host at all — only this proxy can reach it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy. Set `resolver` so nginx resolves the docker DNS name
    # lazily; otherwise a container restart pins a stale IP until reload.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Test runs stream progress; don't cut long-running requests off early.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Fallback for any non-file path: React Router owns the URL in the client,
    # so /projects/:id must return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable and can be cached hard; index.html must not be,
    # or a deploy ships HTML that references deleted chunks.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
